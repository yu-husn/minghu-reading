<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>明湖居聽書｜進階閱讀</title>
<style>
:root{--ink:#213c34;--jade:#275a4d;--gold:#ebcd91;--paper:#fff9ec;--line:#cdbf9f;color:var(--ink);background:#eee9dc;font:700 clamp(17px,1.9vw,20px)/1.68 "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
*{box-sizing:border-box}body{margin:0}main{max-width:1000px;margin:auto;padding:24px clamp(14px,4vw,40px) 60px}header{background:#1c4137;color:#fff7e5;padding:clamp(18px,5vw,44px);border-radius:13px}
h1,h2,p{margin:0}h1{font-size:clamp(2.1rem,6vw,3.4rem);letter-spacing:.05em;line-height:1.2}h2{font-size:1.45rem;margin-bottom:8px}header p+p{margin-top:11px}
.chapter{margin:17px 0;border-block:1px solid #8ba591;padding:11px 0;color:#f0d796}
.primary{display:inline-block;margin-top:12px;min-height:48px;padding:8px 16px;border:1px solid transparent;border-radius:7px;background:var(--gold);color:#253b2d;font:inherit;text-decoration:none;cursor:pointer}
.primary:disabled{cursor:default;opacity:.6}:focus-visible{outline:3px solid #c2742c;outline-offset:3px}a{color:var(--jade);text-underline-offset:4px}
section{margin-top:28px;scroll-margin-top:12px}.group,fieldset{background:var(--paper);border:1px solid var(--line);border-radius:8px}
.group{padding:clamp(12px,3vw,23px)}.group h3{color:var(--jade);margin:0 0 12px}.paragraph+.paragraph{margin-top:22px}
.illustration{position:relative;isolation:isolate;overflow:hidden;margin:0 0 16px;border-radius:8px;background:#4b4639}
.section-art{display:block;width:100%;height:auto}
.arrival-art .section-art{transform-origin:88% 46%}
.inn-art .section-art{transform-origin:54% 41%}
.hall-art .section-art{transform-origin:46% 33%}
.strings-art .section-art{transform-origin:46% 34%}
.heiniu-art .section-art{transform-origin:55% 38%}
.audience-art .section-art{transform-origin:43% 71%}
.entranced-art .section-art,.entrance-frame[data-frame="entranced"]{transform-origin:59% 39%}
.entrance-frames{position:relative;isolation:isolate}
.entrance-frame{position:absolute;inset:0;opacity:0;transition:opacity .5s ease}
.entrance-frame.is-visible{z-index:1;opacity:1}
.entrance-frame.is-underneath{opacity:1;transition:none}
.entrance-frames > img:first-child,.entrance-frame:is([data-frame="lowered"],[data-frame="tap"],[data-frame^="singing"]){transform-origin:52% 16%}
.entrance-frame:is([data-frame="tap"],[data-frame^="singing"]){transition-duration:.18s}
.entrance-frames{overflow:hidden}
.entrance-frame[data-frame="taishan"].is-visible{animation:climb 12s ease-out both}
.entrance-frame[data-frame="huangshan"].is-visible{animation:circle-peaks 5s ease-in-out both}
.entrance-frame[data-frame="fireworks"].is-visible{animation:burst 4.6s ease-out both}
.entrance-frame[data-frame="birds"].is-visible{animation:drift 5s ease-out both}
.entrance-frame[data-frame="applause"].is-visible{animation:drift 5s ease-out both}
.entrance-frame[data-frame="entranced"].is-visible{animation:drift 6s ease-out both}
.entrance-frame[data-frame="wire"].is-visible{animation:drift 3.4s ease-out both}
.entrance-frame[data-frame="underground"].is-visible{animation:emerge 3.1s ease-out both}
.entrance-frame[data-frame="strings"].is-visible{animation:drift 2.6s ease-out both}
.entrance-streak{position:absolute;left:12%;bottom:19%;width:80%;height:2px;z-index:2;pointer-events:none;opacity:0;transform-origin:left;background:linear-gradient(90deg,transparent,#f3e2ba88,#fff9e7);box-shadow:0 0 8px #f6e5a7}
.entrance-streak.is-visible{animation:throw-streak 1.25s ease-out both}
@keyframes climb{from{transform:translate(8%,-12%) scale(1.30)}to{transform:translate(-8%,10%) scale(1.25)}}
@keyframes circle-peaks{0%{transform:translate(0,7%) scale(1.18)}55%{transform:translate(-7%,-4%) scale(1.18)}100%{transform:translate(6%,1%) scale(1.18)}}
@keyframes burst{0%{transform:scale(1.28);transform-origin:50% 76%}28%,100%{transform:scale(1);transform-origin:50% 50%}}
@keyframes drift{from{transform:scale(1.01)}to{transform:scale(1.10)}}
@keyframes emerge{from{transform:scale(1.12) translateY(3%);filter:brightness(.65)}to{transform:scale(1.02);filter:brightness(1)}}
@keyframes throw-streak{0%{opacity:0;transform:rotate(-38deg) scaleX(.02)}24%{opacity:.9}65%{opacity:.7;transform:rotate(-40deg) scaleX(1)}100%{opacity:0;transform:rotate(-43deg) scaleX(1)}}
.entrance-serpent{position:absolute;z-index:2;inset:0;width:100%;height:100%;opacity:0;pointer-events:none;filter:drop-shadow(0 0 5px #f4e6b8)}
.entrance-serpent.is-visible{opacity:.88}
.entrance-serpent path{stroke-dasharray:12 88;animation:snake-through-mist 5s ease-in-out infinite;animation-play-state:paused}
.entrance-serpent.is-visible path{animation-play-state:running}
@keyframes snake-through-mist{0%{stroke-dashoffset:12;opacity:0}16%,83%{opacity:1}100%{stroke-dashoffset:-100;opacity:0}}
@media(prefers-reduced-motion:reduce){.entrance-serpent path{animation:none;stroke-dasharray:none;opacity:.65}}
.entrance-metaphor{position:absolute;z-index:2;inset:clamp(8px,2vw,18px) auto auto clamp(8px,2vw,18px);max-width:calc(100% - 16px);padding:.3em .6em;border:1px solid #f1d29c;border-radius:5px;background:#23382ff5;color:#fff6df;line-height:1.45;font-size:clamp(12px,2.3vw,17px);font-weight:700}
@media(prefers-reduced-motion:reduce){.entrance-frame{transition:none}.entrance-frame[data-frame].is-visible,.entrance-streak.is-visible{animation:none}}
.illustration figcaption{position:absolute;z-index:2;inset:auto 0 0;padding:clamp(10px,3vw,28px);background:linear-gradient(0deg,#17201df5,#17201ddd 72%,#17201d00);color:#fff6df;text-align:center;text-shadow:0 1px 3px #18201e}
.illustration .quote-text{display:block;font-family:"Noto Serif TC","PMingLiU",serif;font-size:clamp(17px,3.2vw,28px);letter-spacing:.035em}
.illustration .long-quote{white-space:pre-line;font-size:clamp(13px,2.7vw,23px);line-height:1.48;letter-spacing:normal}
.paragraph .illustration{margin-top:16px}
.illustration .quote-source{display:block;font-size:clamp(12px,2vw,15px);color:#f3d9a1}
.source{line-height:1.9;scroll-margin-top:16px}.number{font-size:.84em;color:#853b31;margin-right:.5em}
.paragraph-quiz{border-left:3px solid #789885;margin:14px 0 20px;padding:2px 0 2px clamp(8px,2vw,16px)}
.paragraph-quiz h4{font-size:1rem;margin:0;color:var(--jade)}.question-sources{font-size:.86rem;margin:0 0 8px;color:var(--jade)}
fieldset{min-width:0;margin:15px 0;padding:10px clamp(10px,3vw,20px) 15px}legend{max-width:100%;padding:0 .4em;line-height:1.5}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{display:flex;gap:.6em;align-items:flex-start;min-height:52px;border:1px solid var(--line);border-radius:6px;background:#f3eddd;padding:9px;cursor:pointer}
.choice input{appearance:none;flex:none;width:26px;height:26px;margin:.18em 0 0;border:2px solid #718275;border-radius:50%;background:#fffbf1;cursor:inherit}
.choice input:checked{border-color:var(--jade);background:radial-gradient(circle,var(--jade) 0 6px,#fffbf1 6.5px)}
.choice input:focus-visible{outline:2px solid #a46427;outline-offset:3px}
.choice:has(input:checked){background:#e0ebe0;border-color:var(--jade)}
.station-input[data-unanswered]{border-color:#9c4a33}
.unanswered{flex-basis:100%;margin:0;padding:5px 9px;border:1px solid #ba7a61;border-radius:5px;background:#fff4df;color:#773b2d}
.unanswered a{display:inline-flex;align-items:center;min-height:34px;margin:0 5px;color:#713321}
@media(forced-colors:active){.choice input{appearance:auto;accent-color:auto}}
.choice.correct{background:#dcebdc;border-color:#467457}.choice.incorrect{background:#f6dfda;border-color:#944238}
.feedback{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}.feedback p+p{margin-top:5px}.feedback .key{color:var(--jade)}
#result{border:2px solid #678677;border-radius:7px;margin-top:12px;padding:10px 14px;background:#e4efe4;scroll-margin-top:12px}
.controls{display:flex;gap:8px 16px;align-items:center;flex-wrap:wrap}.controls .primary{margin:0}[hidden]{display:none!important}
@media(max-width:620px){.choices{grid-template-columns:1fr}}

.metaphor-gallery{margin:14px 0;border:1px solid #9cae98;border-radius:8px;background:#eef1e5}
.metaphor-gallery summary{min-height:48px;padding:10px 14px;color:#1b594a;cursor:pointer}
.metaphor-gallery[open] summary{border-bottom:1px solid #9cae98}
.metaphor-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:12px}
.metaphor-card{position:relative;min-width:0;margin:0;overflow:hidden;border:1px solid #b5aca0;border-radius:8px;background:#fff9ec}
.metaphor-card img{display:block;width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;background:#dbcbb1}
.metaphor-art{position:relative}
.metaphor-art canvas{position:absolute;inset:0;width:100%;height:100%}
.metaphor-card figcaption{padding:10px 12px 13px;line-height:1.6}
.metaphor-card blockquote{margin:.36em 0 .45em;padding-left:.65em;border-left:3px solid #ae8a51;color:#4b4133;font-family:"Noto Serif TC","PMingLiU",serif}
.metaphor-title{display:block;color:#265b4c}
.metaphor-label{position:absolute;z-index:1;top:8px;left:8px;max-width:calc(100% - 16px);padding:.25em .55em;border-radius:4px;background:#23382ff5;color:#fff6df;font-size:.74rem;line-height:1.4}
.metaphor-description{font-size:.88rem}
@media(max-width:515px){.metaphor-grid{grid-template-columns:1fr}}


.journey-header{position:relative;isolation:isolate;overflow:hidden;background:#332a1f url(img/minghuju-arrival.jpg) center 39%/cover}
.journey-header::before{content:'';position:absolute;z-index:-1;inset:0;background:linear-gradient(90deg,#221e17fa 0%,#271e16ed 38%,#281f16a3 100%)}
.journey-header .chapter{border-color:#c8a97688}
.journey-home{display:inline-block;margin-left:12px;color:#fff1cf}
.journey-intro{margin-bottom:14px}
#station-map{margin:14px 0 20px;border:1px solid #b7a784;border-radius:9px;background:#ede4ce}
#station-map summary{padding:9px 14px;min-height:44px;color:#274c3e;cursor:pointer}
.station-route{list-style:none;margin:0;padding:0 10px 10px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.station-route button{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-width:0;width:100%;min-height:60px;padding:6px 10px;border:1px solid #aa9d80;border-radius:6px;background:#fff9ec;color:#274537;font:inherit;line-height:1.35;text-align:left;cursor:pointer}
.station-route small{font-size:.76em}
.station-route button:disabled{color:#635947;background:#e6deca;cursor:default}
.station-route button[aria-current="step"]{border:2px solid #8c462b;background:#f1d6a4}
.station-route button.is-collected:not([aria-current]){background:#e3ecdf;border-color:#819d82}
.group{margin-top:0}
.station-heading{display:grid;gap:4px;margin-bottom:12px}
.station-heading p{color:#8e412c;font-size:.84rem}
.station-heading h3{font-size:clamp(1.4rem,4vw,2.2rem);line-height:1.2;margin:0}
.station-task{margin:10px 0 18px;padding:10px 13px;border-left:4px solid #a0573d;background:#f0e5ca}
.station-task strong{display:block;color:#823b29}
.station-controls{position:sticky;z-index:5;bottom:0;display:flex;flex-wrap:wrap;align-items:center;gap:7px 10px;padding:9px 0 max(9px,env(safe-area-inset-bottom));background:#eee9dc}
.station-controls .primary{margin:0}
.station-controls .secondary{min-height:44px;padding:6px 13px;border:1px solid #867657;border-radius:6px;background:#fff9ec;color:#264f41;font:inherit;cursor:pointer}
.station-status{flex:1 1 220px;color:#3d5c4d;font-size:.85rem}
.station-recap{margin:14px 0 10px}
.station-recap ol{display:flex;gap:10px;overflow-x:auto;list-style:none;margin:0;padding:0 0 10px;scroll-snap-type:x proximity}
.station-recap li{flex:0 0 clamp(135px,27vw,180px);scroll-snap-align:start}
.station-recap button{width:100%;height:100%;padding:0 0 5px;overflow:hidden;border:1px solid #887759;border-radius:6px;background:#faf3df;color:#214337;font:inherit;text-align:center;cursor:pointer}
.station-recap img{display:block;width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;margin-bottom:4px}
.station-wrong a{display:inline-block;margin:2px 8px 2px 0}
.source-copy{font-weight:inherit}
.source .metaphor-gallery{line-height:1.55}
.station-input{scroll-margin-bottom:95px}
@media(max-width:580px){.station-route{grid-template-columns:repeat(2,minmax(0,1fr))}.station-controls{gap:6px}.station-status{flex:1 0 100%}.station-controls .primary,.station-controls .secondary{min-height:44px;padding:5px 10px}.journey-home{margin:10px 0 0;display:block}}


.reading-strategy{margin:8px 0 16px;border:1px solid #abaf95;border-radius:7px;background:#edf0df}
.reading-strategy .reading-strategy-title{padding:8px 12px 4px;color:#274c3e;font-size:1rem}
.reading-strategy p{padding:0 12px 10px;font-size:.9rem}
.source-readback{outline:2px solid #a8782e;outline-offset:5px;border-radius:2px}
.source-readback .number{font-weight:800}
.question-sources a{display:inline-flex;align-items:center;min-height:36px;margin:2px;padding:0 7px;border:1px solid #8aab92;border-radius:5px;background:#edf1e3}

</style>
</head>
<body><main>
<header class="journey-header">
<h1>明湖居聽書</h1>
<p class="chapter">《老殘遊記》第二回<br>歷山山下古帝遺蹤　明湖湖邊美人絕調</p>
<p>國中讀的是本回前半部〈大明湖〉，跟著老殘遊湖賞景。高中國文的〈王小玉說書〉取材自本回後半部。接下來就跟老殘進戲園，聽王小玉說書。</p>
<p><strong>你的任務</strong>　完成八站閱讀，集齊八幕《明湖聽書卷》。遇到譬喻時，可以搭配意象圖閱讀。讀完本站並答完題目，再前往下一站。全程共 <span id="question-total"></span> 題選擇題，最後交卷看成績與解析。</p>
<a class="primary" href="#reading">出發，跟老殘去聽書</a>
<a class="journey-home" href="index.html">返回明湖尋景</a>
</header>
<section id="reading">
<h2 id="journey-title">聽書路線</h2>
<details id="station-map" open>
<summary>查看八站與收集進度</summary>
<ol class="station-route" id="station-route"></ol>
</details>
<form id="quiz-form">
<div id="reading-groups"></div>
<div id="result" role="status" tabindex="-1" hidden></div>
<div class="station-controls">
<output class="station-status" id="progress" aria-live="polite"></output>
<div class="unanswered" id="unanswered" role="status" hidden></div>
<button class="secondary" id="back-to-question" type="button" hidden>回到題目</button>
<button class="secondary" id="previous-station" type="button" hidden>上一站</button>
<button class="primary" id="next-station" type="button">下一站</button>
<button class="primary" id="submit" type="submit" hidden>交卷看解析</button>
<button class="secondary" id="show-recap" type="button" hidden>回到聽書卷</button>
<button class="secondary" id="restart" type="button" hidden>重新作答</button>
</div>
</form>
</section>

<script>
const passage = ["到了鵲華橋，才覺得人煙稠密，也有挑擔子的，也有推小車子的，也有坐二人抬小藍呢轎子的。轎子後面，一個跟班的戴個紅纓帽子，膀子底下夾個護書，拼命價奔，一面用手中擦汗，一面低著頭跑。街上五六歲的孩子不知避人，被那轎夫無意踢倒一個，他便哇哇的哭起。他的母親趕忙跑來問：「誰碰倒你的？誰碰倒你的？」那個孩子只是哇哇的哭，並不說話。問了半天，才帶哭說了一句道：「抬轎子的！」他母親抬頭看時，轎子早已跑的有二里多遠了。那婦人牽了孩子，嘴裡不住咭咭咕咕的罵著，就回去了。","老殘從鵲華橋往南，緩緩向小布政司街走去。一抬頭，見那牆上貼了一張黃紙，有一尺長，七八寸寬的光景。居中寫著「說鼓書」三個大字，旁邊一行小字是「二十四日明湖居」。那紙還未十分乾，心知是方才貼的，只不知道這是甚麼事情，別處也沒有見過這樣招子。一路走著，一路盤算，只聽得耳邊有兩個挑擔子的說道：「明兒白妞說書，我們可以不必做生意，來聽書罷。」又走到街上、聽鋪子裡櫃臺上有人說道：「前次白妞說書是你告假的，明兒的書，應該我告假了。」一路行來，街談巷議，大半都是這話，心裡詫異道：「白妞是何許人？說的是何等樣書，為甚一紙招貼，便舉國若狂如此？」信步走來，不知不覺已到高陞店口。","進得店去，茶房便來回道：「客人，用什麼夜膳？」老殘一一說過，就順便問道：「你們此地說鼓書是個甚麼玩意兒，何以驚動這麼許多的人？」茶房說：「客人，你不知道。這說鼓書本是山東鄉下的土調，用一面鼓、兩片梨花簡，名叫『梨花大鼓』，演說些前人的故事。本也沒甚稀奇，自從王家出了這個白妞、黑妞姊妹兩個，這白妞名字叫做王小玉，此人是天生的怪物！他十二三歲時就學會了這說書的本事。他卻嫌這鄉下的調兒沒甚麼出奇，他就常到戲園裡看戲，所有甚麼西皮、二簧、梆子腔等唱。一聽就會；甚麼余三勝、程長庚、張二奎等人的調子，他一聽也就會唱。仗著他的喉嚨，要多高有多高；他的中氣，要多長有多長。他又把那南方的甚麼崑腔、小曲，種種的腔調，他都拿來裝在這大鼓書的調兒裡面。不過二三年工夫，創出這個調兒，竟至無論南北高下的人，聽了他唱書，無不神魂顛倒。現在已有招子，明兒就唱。你不信，去聽一聽就知道了。只是要聽還要早去，他雖是一點鐘開唱，若到十點鐘去，便沒有坐位的。」老殘聽了，也不甚相信。","次日六點鐘起，先到南門內看了舜井。又出南門，到歷山腳下，看看相傳大舜昔日耕田的地方。及至回店，已有九點鐘的光景。趕忙吃了飯，走到明湖居，才不過十點鐘時候。那明湖居本是個大戲園子，戲臺前有一百多張桌子。那知進了園門，園子裡面已經坐的滿滿的了。只有中間七八張桌子還無人坐，桌子卻都貼著「撫院定」、「學院定」等類紅紙條兒。老殘看了半天，無處落腳，只好袖子裡送了看坐兒的二百個錢，才弄了一張短板凳，在人縫裡坐下。看那戲臺上，只擺了一張半桌，桌子上放了一面板鼓，鼓上放了兩個鐵片兒，心裡知道這就是所謂梨花簡了。旁邊放了一個三弦子，半桌後面放了兩張椅子，並無一個人在臺上。偌大的個戲臺，空空洞洞，別無他物，看了不覺有些好笑。園子裡面，頂著籃子賣燒餅油條的有一二十個，都是為那不吃飯來的人買了充飢的。","到了十一點鐘，只見門口轎子漸漸擁擠，許多官員都著了便衣，帶著家人，陸續進來。不到十二點鐘，前面幾張空桌俱已滿了，不斷還有人來，看坐兒的也只是搬張短凳，在夾縫中安插。這一群人來了，彼此招呼，有打千兒的，有作揖的，大半打千兒的多。高談闊論，說笑自如。這十幾張桌子外，看來都是做生意的人，又有些像是本地讀書人的樣子，大家都嘁嘁喳喳的在那裡說閒話。因為人太多了，所以說的甚麼話都聽不清楚，也不去管他。","到了十二點半鐘，看那臺上，從後臺簾子裡面，出來一個男人。穿了一件藍布長衫，長長的臉兒，一臉疙瘩，彷彿風乾福橘皮似的，甚為醜陋，但覺得那人氣味到還沉靜。出得臺來，並無一語，就往半桌後面左手一張椅子上坐下。慢慢的將三弦子取來，隨便和了和弦，彈了一兩個小調，人也不甚留神去聽。後來彈了一枝大調，也不知道叫什麼牌子。只是到後來，全用輪指，那抑揚頓挫，入耳動心，恍若有幾十根弦，幾百個指頭在那裡彈似的。這時臺下叫好的聲音不絕於耳，卻也壓不下那弦子去。這曲彈罷，就歇了手，旁邊有人送上茶來。","停了數分鐘時，簾子裡面出來一個姑娘，約有十六七歲，長長鴨蛋臉兒，梳了一個抓髻，戴了一副銀耳環，穿了一件藍布外褂兒，一條藍布褲子，都是黑布鑲滾的。雖是粗布衣裳，到十分潔淨。來到半桌後面右手椅子上坐下。那彈弦子的便取了弦子，錚錚鏦鏦彈起。這姑娘便立起身來，左手取了梨花簡，夾在指頭縫裡，便丁丁當當的敲，與那弦子聲音相應。右手持了鼓捶子，凝神聽那弦子的節奏。忽羯鼓一聲，歌喉遽發，字字清脆，聲聲宛轉，如新鶯出谷，乳燕歸巢，每句七字，每段數十句，或緩或急，忽高忽低。其中轉腔換調之處，百變不窮，覺一切歌曲腔調俱出其下，以為觀止矣。","旁坐有兩人，其一人低聲問那人道：「此想必是白妞了罷？」其一人道：「不是。這人叫黑妞，是白妞的妹子。他的調門兒都是白妞教的，若比白妞，還不曉得差多遠呢！他的好處人說得出，白妞的好處人說不出；他的好處人學的到，白妞的好處人學不到。你想，這幾年來，好玩耍的誰不學他們的調兒呢？就是窯子裡的姑娘，也人人都學，只是頂多有一兩句到黑妞的地步。若白妞的好處，從沒有一個人能及他十分裡的一分的。」說著的時候，黑妞早唱完，後面去了。這時滿園子裡的人，談心的談心，說笑的說笑。賣瓜子、落花生、山裡紅、核桃仁的，高聲喊叫著賣，滿園子裡聽來都是人聲。","正在熱鬧哄哄的時節，只見那後臺裡，又出來了一位姑娘，年紀約十八九歲，裝束與前一個毫無分別。瓜子臉兒，白淨麵皮，相貌不過中人以上之姿，只覺得秀而不媚，清而不寒。半低著頭出來，立在半桌後面，把梨花簡了當了幾聲。煞是奇怪，只是兩片頑鐵，到他手裡，便有了五音十二律似的。又將鼓捶子輕輕的點了兩下，方抬起頭來，向臺下一盼。那雙眼睛，如秋水，如寒星，如寶珠，如白水銀裡頭養著兩丸黑水銀，左右一顧一看，連那坐在遠遠牆角子裡的人，都覺得王小玉看見我了，那坐得近的更不必說。就這一眼，滿園子裡便鴉雀無聲，比皇帝出來還要靜悄得多呢，連一根針跌在地下都聽得見響！","王小玉便啟朱脣，發皓齒，唱了幾句書兒。聲音初不甚大，只覺入耳有說不出來的妙境。五臟六腑裡，像熨斗熨過，無一處不伏貼。三萬六千個毛孔，像吃了人參果，無一個毛孔不暢快。唱了十數句之後，漸漸的越唱越高，忽然拔了一個尖兒，像一線鋼絲拋入天際，不禁暗暗叫絕。那知他於那極高的地方，尚能迴環轉折。幾囀之後，又高一層，接連有三四疊，節節高起。恍如由傲來峰西面攀登泰山的景象，初看傲來峰削壁千仞，以為上與天通。及至翻到傲來峰頂，才見扇子崖更在傲來峰上。及至翻到扇子崖，又見南天門更在扇子崖上。愈翻愈險，愈險愈奇。","那王小玉唱到極高的三四疊後，陡然一落，又極力騁其千迴百折的精神，如一條飛蛇在黃山三十六峰半中腰裡盤旋穿插。頃刻之間，周匝數遍。從此以後，愈唱愈低，愈低愈細，那聲音漸漸的就聽不見了。滿園子的人都屏氣凝神，不敢少動。約有兩三分鐘之久，彷彿有一點聲音從地底下發出。這一出之後，忽又揚起，像放那東洋煙火，一個彈子上天，隨化作千百道五色火光，縱橫散亂。這一聲飛起，即有無限聲音俱來並發。那彈弦子的亦全用輪指，忽大忽小，同他那聲音相和相合，有如花塢春曉，好鳥亂鳴。耳朵忙不過來，不曉得聽那一聲的為是。正在撩亂之際，忽聽霍然一聲，人弦俱寂。這時臺下叫好之聲，轟然雷動。","停了一會，鬧聲稍定，只聽那臺下正座上，有一個少年人，不到三十歲光景，是湖南口音，說道：「當年讀書，見古人形容歌聲的好處，有那『餘音繞梁，三日不絕』的話，我總不懂。空中設想，餘音怎樣會得繞梁呢？又怎會三日不絕呢？及至聽了小玉先生說書，才知古人措辭之妙。每次聽他說書之後，總有好幾天耳朵裡無非都是他的書，無論做什麼事，總不入神，反覺得『三日不絕』，這『三日』二字下得太少，還是孔子『三月不知肉味』，『三月』二字形容得透徹些！」旁邊人都說道：「夢湘先生論得透闢極了！『於我心有戚戚焉』！」","說著，那黑妞又上來說了一段，底下便又是白妞上場。這一段，聞旁邊人說，叫做「黑驢段」。聽了去，不過是一個士子見一個美人，騎了一個黑驢走過去的故事。將形容那美人，先形容那黑驢怎樣怎樣好法，待鋪敘到美人的好處，不過數語，這段書也就完了。其音節全是快板，越說越快。白香山詩云：「大珠小珠落玉盤。」可以盡之。其妙處在說得極快的時候，聽的人彷彿都趕不上聽，他卻字字清楚，無一字不送到人耳輪深處。這是他的獨到，然比著前一段卻未免遜一籌了。","這時不過五點鐘光景，算計王小玉應該還有一段。不知那一段又是怎樣好法，究竟如何，且聽下回分解。"];
const questions = [["作者在寫到「說鼓書」招子之前，先寫鵲華橋上的挑擔者、推車人和匆忙的轎子。後面又寫挑擔者和店員談聽書。這些街景一起起了什麼作用？",["讓讀者看出老殘準備離開濟南，只好順道向街坊打聽","用熱鬧的市街和不同人的議論，讓說書盛況先在場外出現","從官員乘轎趕路推知劇場即將開唱，交代演出延遲的原因","交代高陞店門前的爭執，解釋老殘為何改住明湖居"],1,[1,2],"市街先呈現人群活動，招貼出現後，再由挑擔人和店員的議論寫消息傳遍各處，白妞出場前已見其號召力。"],["老殘起初不太相信茶房說十點到就沒有座位。哪一組情報最能讓讀者知道茶房所言有據？",["說書用板鼓和梨花簡，臺上也擺有三弦與兩把椅子","茶房說王小玉能學南北腔調，場內也有各種身分的聽眾","前一晚有人說要歇業聽書，劇場門口也有人販賣吃食","說書一點才開始，十點桌席已滿，老殘還得付錢找短凳"],3,[3,4],"同一組線索包含表演與到場的時間差和找不到座位的實際後果，最能直接印證茶房的預告。"],["茶房說王小玉一聽就會唱別人的曲調，又把各地曲調放進大鼓書。哪個概括保留了這段的兩層意思？",["能迅速掌握既有曲調，也能融會不同聲腔創出新調","能演唱各地曲調，也能請不同流派的名角同臺說書","學熟山東傳統曲調，再以原本的腔調表演南方故事","擅長用板鼓控制節奏，再把北方戲曲改成以三弦伴奏"],0,[3],"前一層是聽過即可模仿，後一層是把各家曲調吸收進大鼓書，創造自己的聲腔。"],["三弦樂手出場時幾乎無人留神，後來臺下叫好聲不斷。這個變化主要從哪裡寫出他的技藝？",["從樂手換上正式衣服寫起，描出外形如何改變觀眾印象","從樂手開始介紹曲牌寫起，說明聽眾如何辨認所彈曲調","從聽眾注意與反應的轉變，襯出輪指演奏的感染力","從樂手叫人送茶的過程，帶出聽眾等候演出的時間"],2,[6],"起初聽眾沒有特別留神，輪指彈奏後叫好聲不斷。讀者從聽眾的反應感受到技巧的力量。"],["作者先將黑妞的表演寫得精妙，再讓鄰座說白妞更難模仿。這兩層安排合在一起，最能讓讀者得到什麼印象？",["黑妞是先登臺的配角，作者藉鄰座介紹縮短她和白妞的演出","黑妞已達很高水準，這個起點使讀者更期待白妞能高到哪裡","兩人裝束與樂器相近，鄰座的談話預告她們將一同登臺","兩人的技法各有專長，鄰座的談話說明聽眾分成兩派"],1,[7,8],"先讓黑妞的技藝成為一個很高的標準，再讓旁人指出白妞的造詣更難企及。白妞尚未出場，期待已經被拉高。"],["黑妞退場後滿園喧鬧，白妞只往臺下一望，場內便靜了。這個前後對照最直接表現什麼？",["黑妞與白妞演出之間空檔很長，讓觀眾有時間起身走動","觀眾看到白妞和黑妞的服裝相同，一時分不清臺上站著誰","戲園賣零嘴的聲音太大，白妞只好停下敲擊等待秩序恢復","白妞還未開唱，就已能抓住滿場觀眾的注意力"],3,[8,9],"退場後的熱鬧是對照背景。白妞一盼，遠近聽眾都覺得被看見，並立刻安靜，凸顯登場的吸引力。"],["「連一根針跌在地下都聽得見響」安排在白妞環顧臺下之後，這句最主要在證明什麼？",["極小的聲音也清楚可聞，凸顯人群因專注而瞬間安靜","臺下聽眾一直在尋找落針的方向，表現戲園非常寬廣","王小玉動作有節奏，落針聲和鼓聲可以同時聽到","戲臺到牆角的距離很遠，觀眾仍聽得見伴奏而為之喝采"],0,[9],"落針可聞是誇飾。作者藉這個想像讓讀者體會由喧鬧轉成全場屏息的反差。"],["白妞剛開唱，作者用熨斗與人參果形容聽眾的感受。這兩個譬喻有什麼共同的寫法？",["用故事背景交代觀眾的日常飲食，表現聽書進入濟南人的生活","用兩件可見的物品描出聲音的形狀，表現歌喉筆直地向上升","把聽覺經驗寫成遍及身體的伏貼與暢快，讓感受具體可想","把演唱寫成身體承受的重量和壓力，表現音聲逐漸變得沉重"],2,[10],"熨斗的伏貼與人參果帶來的暢快，都把難以描寫的聲音轉成身體能想像的感覺。"],["同樣寫高音，「一線鋼絲拋入天際」與接下來描寫攀登泰山，各抓住聲音哪一種變化？",["前者寫高處的迴旋，後者寫旋律從高處直落","前者寫突拔的細高音，後者寫越過一層又升一層","前者寫逐層升高的過程，後者寫高音突然停歇","前者寫多聲齊響，後者寫低音慢慢變得微細"],1,[10],"鋼絲拋起是一瞬間的拔高，登泰山的三處地勢則是一層比一層高，對應連續幾疊節節上升。"],["王小玉唱到極高處後，哪一組畫面能呈現接下來的音勢？",["猛然下降又盤旋，聲音漸細至停，微聲再起後突然向上迸開","先從地底隱約傳來，猛然向上迸開，接著高音再逐層上升","始終在高處盤旋，漸漸匯成眾鳥合鳴，最後只留下弦聲","先逐聲升高，再像煙火向外迸開，之後才急降至幾 function playWhenVisible(elements, start) {
  const visible = new Map();
  const observer = new IntersectionObserver(entries => {
    for (const entry of entries) {
      if (!entry.isIntersecting || entry.intersectionRatio < .05) {
        visible.get(entry.target)?.();
        visible.delete(entry.target);
      } else if (!document.hidden && entry.intersectionRatio >= .32 && !visible.has(entry.target)) {
        visible.set(entry.target,start(entry.target));
      }
    }
  },{threshold:[0,.05,.32]});
  elements.forEach(element=>observer.observe(element));
  document.addEventListener('visibilitychange',()=>{
    if (document.hidden) {
      visible.forEach(stop=>stop?.());
      visible.clear();
      observer.disconnect();
    } else {
      elements.forEach(element=>observer.observe(element));
    }
  });
}

function renderMetaphorGallery(number, cards, groupIndex) {

      +(reuse ? '' : 'metaphor-')+id+'.jpg" alt="'+esc(alt)+'"><span class="metaphor-label">'+esc(kind||'譬喻想像')
      +'</span></div><figcaption><strong class="metaphor-title">'+esc(name)+'</strong><blockquote>'+esc(quote)

      +'</figcaption></figure>';
    }
    ).join('')+'</div></details>';
}

function renderPassage(number, text) {
  const copy = value => value ? '<span class="source-copy">'+esc(value)+'</span>' : '';
  const opening = '<div id="paragraph-'+number+'" class="source" tabindex="-1"><span class="number">第 '+number+' 段</span>';
  const sizes = metaphorGrouping[number];
  if (!sizes) return opening+copy(text)+'</div>';

  let reading = opening;
  let cursor = 0;
  let offset = 0;
  for (const [groupIndex,size] of sizes.entries()) {
    const cards = metaphorScenes[number].slice(offset,offset+size);
    offset += size;
    const quote = cards.at(-1)[2];
    const found = text.indexOf(quote,cursor);
    if (found < 0) {
      reading += renderMetaphorGallery(number,cards,groupIndex);
      continue;
    }
    let end = found + quote.length;
    if (!/[。！？]$/.test(quote)) {
      const boundary = text.slice(end).search(/[。！？]/);
      end = boundary < 0 ? text.length : end + boundary + 1;
    }
    while (/[）」』]/.test(text.charAt(end)) && end < text.length) end++;
    reading += copy(text.slice(cursor,end));
    if (number===11 && cards[0][0]==='thunder') reading += applauseIllustration;
    reading += renderMetaphorGallery(number,cards,groupIndex);
    cursor = end;
  }
  return reading+copy(text.slice(cursor))+'</div>';
}

const zoomTargets = {arrival:'translateX(-3%) scale(1.46)',inn:'scale(1.35)',hall:'scale(1.62)',strings:'scale(1.34)',heiniu:'scale(1.55)',entranced:'scale(1.48)',audience:'scale(1.23)'};
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
playWhenVisible([...document.querySelectorAll('[data-scene]')].filter(scene=>zoomTargets[scene.dataset.scene]),scene=>{
  if (reducedMotion.matches) return;
  const zoom = scene.querySelector('.section-art').animate(
    [{transform:'none'},{transform:zoomTargets[scene.dataset.scene]}],
    {duration:7200,easing:'ease-in-out',fill:'forwards'}
  );
  return ()=>zoom.cancel();
});
const entranceMetaphors = {
  wire: '譬喻想像｜鋼絲拋入天際：歌聲突然拔高',
  taishan: '譬喻想像｜攀登泰山：歌聲一層層升高',
  huangshan: '譬喻想像｜飛蛇穿過群峰：歌聲迴旋轉折',
  underground: '譬喻想像｜聲音彷彿從地底微微透出',
  fireworks: '譬喻想像｜煙火迸開：歌聲陡然揚起，眾音並發',
  birds: '譬喻想像｜春園群鳥齊鳴：歌聲與三弦相和'
};
const entranceCues = [
  [0, 'lowered', '半低著頭出來，立在半桌後面'],
  [1750, 'tap', '又將鼓捶子輕輕的點了兩下'],
  [2050, 'lowered'],
  [2400, 'tap'],
  [2700, 'lowered'],
  [3200, 'glance', '方抬起頭來，向臺下一盼'],
  [5050, 'glance', lastEntranceCaption],
  [6370, 'singing-soft', singingQuote, 10],
  [6650, 'singing-open'],
  [7160, 'singing-soft', '聲音初不甚大', 10],
  [7480, 'singing-open'],
  [8000, 'singing-soft'],
  [8330, 'glance'],
  [8700, 'singing-soft'],
  [8940, 'singing-open'],
  [9520, 'singing-soft'],
  [9900, 'singing-open'],
  [10410, 'singing-soft'],
  [10860, 'singing-soft'],
  [11500, 'entranced', listenersQuote, 10],
  [18500, 'singing-soft', '唱了十數句之後，漸漸的越唱越高', 10],
  [20000, 'singing-open'],
  [21400, 'wire', '忽然拔了一個尖兒，像一線鋼絲拋入天際', 10],
  [24500, 'taishan', '那知他於那極高的地方，尚能迴環轉折。幾囀之後，又高一層', 10],
  [27700, 'taishan', '才見扇子崖更在傲來峰上', 10],
  [30600, 'taishan', '又見南天門更在扇子崖上', 10],
  [33300, 'taishan', '接連有三四疊，節節高起。愈翻愈險，愈險愈奇。', 10],
  [35700, 'huangshan', '唱到極高的三四疊後，陡然一落', 11],
  [38100, 'huangshan', '如一條飛蛇在黃山三十六峰半中腰裡盤旋穿插', 11],
  [41600, 'singing-soft', '愈唱愈低，愈低愈細', 11],
  [43900, 'singing-soft', '那聲音漸漸的就聽不見了。', 11],
  [45800, 'entranced', '滿園子的人都屏氣凝神，不敢少動。', 11],
  [48600, 'underground', '彷彿有一點聲音從地底下發出', 11],
  [51500, 'fireworks', '忽又揚起，像放那東洋煙火', 11],
  [54700, 'fireworks', '隨化作千百道五色火光，縱橫散亂。', 11],
  [57700, 'strings', '那彈弦子的亦全用輪指，忽大忽小', 11],
  [59400, 'birds', '同他那聲音相和相合，有如花塢春曉，好鳥亂鳴。', 11],
  [62200, 'glance', '忽聽霍然一聲，人弦俱寂。', 11],
  [64600, 'applause', applauseQuote, 11]
];
const entranceDuration = 69500;
const entranceOpening = 11500;
const slowEntranceOpening = milliseconds => milliseconds+Math.min(milliseconds,entranceOpening)*.25;

let entrancesPlaying = false;
let entranceTimers = [];
let entranceCloseups = [];
let entranceFrameImages;
let currentEntranceFrame;
let entranceFrameLoad;


async function loadEntranceFrames() {
  const sources = {
    lowered:'bainiu-lowered',tap:'bainiu-tap',
    'singing-soft':'bainiu-singing-soft','singing-open':'bainiu-singing-open',
    entranced:'entranced',wire:'metaphor-silver-wire',taishan:'taishan',
    huangshan:'huangshan',underground:'metaphor-underground-tone',
    fireworks:'fireworks',strings:'strings',birds:'spring-dawn',applause:'applause'
  };
  const images = Object.entries(sources).map(([frame,art]) => {
    const image = new Image(1536, 1024);
    image.className = 'section-art entrance-frame';
    image.alt = '';
    image.setAttribute('aria-hidden', 'true');
    image.dataset.frame = frame;
    image.src = 'img/minghuju-'+art+'.jpg';
    return image;
  });
  await Promise.all(images.map(image => image.decode()));
  entranceFrames.append(...images);
  return Object.fromEntries(images.map(image => [image.dataset.frame,image]));
}

function showEntranceFrame(frame, caption, paragraph = 9) {
  const metaphor = entranceMetaphors[frame];
  entranceMetaphorLabel.textContent = metaphor || '';
  entranceMetaphorLabel.hidden = !metaphor;
  entranceStreak.classList.toggle('is-visible',frame==='wire');
  entranceFrames.querySelector('.entrance-serpent').classList.toggle('is-visible',frame==='huangshan');
  if (frame!==currentEntranceFrame) {
    for (const [name, image] of Object.entries(entranceFrameImages)) {
      image.classList.toggle('is-underneath',frame!=='glance'&&name===currentEntranceFrame);
      image.classList.toggle('is-visible',name===frame);
    }
    currentEntranceFrame = frame;
  }
  if (caption) {
    entranceCaption.textContent = caption;
    entranceCaption.classList.toggle('long-quote',caption===listenersQuote);
    entranceSource.textContent = '課文第 '+paragraph+' 段';
  }
}

function stopEntrance(completed = false) {
  entranceTimers.forEach(clearTimeout);
  entranceTimers = [];
  entrancesPlaying = false;
  window.dispatchEvent(new Event('minghu-entrance-stop'));
  if (!completed) {
    entranceCloseups.forEach(closeup=>closeup.cancel());
    entranceCloseups = [];
    if (entranceFrameImages) showEntranceFrame('glance', lastEntranceCaption);
  }
}

playWhenVisible([entranceFrames],()=>{
  if (reducedMotion.matches) return;
  let visible = true;
  entranceFrameLoad ??= loadEntranceFrames().catch(()=>{
    entranceFrameLoad = undefined;
    return null;
  });
  entranceFrameLoad.then(images=>{
    if (!visible || !images || entranceFrames.closest('.station').hidden) return;
    entranceFrameImages = images;
    entrancesPlaying = true;
    entranceCloseups = [entranceFrames.firstElementChild,images.lowered,images.tap,images['singing-soft'],images['singing-open']].map(image=>
      image.animate([{transform:'scale(1.015)'},{transform:'scale(1.12)'}],{duration:3400,easing:'ease-out',fill:'both'}));
    const [,firstFrame,firstCaption] = entranceCues[0];
    showEntranceFrame(firstFrame,firstCaption);
    entranceTimers = entranceCues.slice(1).map(([delay,frame,caption,paragraph]) =>
      setTimeout(()=>{
        showEntranceFrame(frame,caption,paragraph);
        if (frame==='applause') window.dispatchEvent(new Event('minghu-entrance-applause'));
      },slowEntranceOpening(delay)));
    entranceTimers.push(setTimeout(()=>stopEntrance(true),slowEntranceOpening(entranceDuration)));
  });
  return ()=>{
    visible = false;
    stopEntrance();
  };
});


const stations = [...readingGroups.querySelectorAll('.station')];
const fields = [...readingGroups.querySelectorAll('fieldset')];
const stationFields = stations.map(station => [...station.querySelectorAll('fieldset')]);
const route = byId('station-route');
const previousStation = byId('previous-station');
const nextStation = byId('next-station');
let activeStation = 0;
let returnQuestion;
const backToQuestion = byId('back-to-question');

route.innerHTML = sections.map(([title],index) =>
  '<li><button type="button" data-station-link="'+index+'"><span>'+(index+1)+'　'+esc(title)+'</span>'
  +'<small></small></button></li>').join('');
const stationButtons = [...route.querySelectorAll('button')];

function missingAnswers(index) {
  return stationFields[index].filter(field => !field.querySelector('input:checked'));
}

const unanswered = byId('unanswered');
let unansweredScope;
function updateUnanswered() {
  const pending = unansweredScope==='all' ? stations.flatMap((station,index) => missingAnswers(index))
    : unansweredScope===undefined ? [] : missingAnswers(unansweredScope);
  fields.forEach(field => field.toggleAttribute('data-unanswered',pending.includes(field)));
  unanswered.hidden = !pending.length;
  unanswered.replaceChildren();
  if (!pending.length) {
    unansweredScope = undefined;
    return;
  }
  unanswered.append('尚未作答');
  for (const field of pending) {
    const link = document.createElement('a');
    link.href = '#'+field.id;
    link.textContent = '第 '+field.id.slice('question-'.length)+' 題';
    unanswered.append(link);
  }
}

function updateProgress() {
  const finished = stations.map((station,index) => missingAnswers(index).length===0);
  const collected = finished.filter(Boolean).length;
  const firstPending = finished.indexOf(false);
  const last = activeStation===stations.length-1;
  const count = form.querySelectorAll('input[type=radio]:checked').length;
  byId('progress').textContent = (graded?'回看第 '+(activeStation+1)+' 站　':'')+'已收集 '+collected+' / '+stations.length
    +' 幕 · 已作答 '+count+' / '+questions.length+' 題'
    +(graded ? '' : ' · 本站 '+(stationFields[activeStation].length-missingAnswers(activeStation).length)+' / '+stationFields[activeStation].length+' 題');
  stationButtons.forEach((button,index) => {
    const here = index===activeStation;
    button.disabled = !graded && !here && firstPending!==-1 && index>firstPending;
    button.classList.toggle('is-collected',finished[index]);
    if (here) button.setAttribute('aria-current','step');
    else button.removeAttribute('aria-current');
    button.querySelector('small').textContent = here ? '目前這一站' : finished[index] ? '已收集' : button.disabled ? '待前往' : '可前往';
  });
  previousStation.hidden = activeStation===0;
  nextStation.hidden = last;
  nextStation.textContent = last ? '下一站' : '前往'+sections[activeStation+1][0];
  submit.hidden = graded || !last;
  submit.disabled = graded;
  updateUnanswered();
}

function clearReadingReturn() {
  readingGroups.querySelector('.source-readback')?.classList.remove('source-readback');
  backToQuestion.hidden = true;
  returnQuestion = undefined;
}

backToQuestion.addEventListener('click', () => {
  if (!returnQuestion) return;
  const hash = '#question-'+returnQuestion;
  jumpToSource(hash);
});
function showStation(index, {focus = true, scroll = true} = {}) {
  if (!stations[index]) return;
  clearReadingReturn();
  if (index!==activeStation && entrancesPlaying) stopEntrance();
  activeStation = index;
  stations.forEach((station,i) => { station.hidden = i!==index; });
  if (graded) result.hidden = true;
  updateProgress();
  const heading = stations[index].querySelector('h3');
  if (focus) heading.focus({preventScroll:true});
  if (scroll) stations[index].scrollIntoView({block:'start'});
}

previousStation.addEventListener('click',() => showStation(activeStation-1));
nextStation.addEventListener('click',() => {
  if (!graded && missingAnswers(activeStation).length) {
    unansweredScope = activeStation;
    updateUnanswered();
    return;
  }
  showStation(activeStation+1);
});

route.addEventListener('click', event => {
  const button = event.target.closest('[data-station-link]');
  if (button) showStation(Number(button.dataset.stationLink));
});

function jumpToSource(hash) {
  const target = byId(hash.slice(1));
  if (!target || !target.matches('.source, .station-input, .station-heading h3')) return;
  const index = stations.indexOf(target.closest('.station'));
  showStation(index,{focus:false,scroll:false});
  target.scrollIntoView({block:'start'});
  target.focus({preventScroll:true});
}

function renderRecap() {
  const pictures = sections.map(([title,,,art,alt]) =>
    [title,art==='bainiu'?'bainiu-glance':art,alt]);
  return '<section class="station-recap"><h3>《明湖聽書卷》</h3><ol>'
    +pictures.map(([title,art,alt],index) => '<li><button type="button" data-station-link="'+index+'">'
      +'<img width="360" height="240" src="img/minghuju-'+art+'.jpg" alt="'+esc(alt)+'" loading="lazy">'
      +esc(title)+'</button></li>').join('')
    +'</ol></section>';
}

function showRecap() {
  if (!graded) return;
  result.hidden = false;
  result.scrollIntoView({block:'start'});
  result.focus({preventScroll:true});
}

document.addEventListener('click', event => {
  const link = event.target.closest('a[href^="#paragraph-"], a[href^="#question-"]');
  if (!link) return;
  const hash = link.getAttribute('href');
  if (link.dataset.returnQuestion) {
    event.preventDefault();
    jumpToSource(hash);
    const target = byId(hash.slice(1));
    target.classList.add('source-readback');
    returnQuestion = link.dataset.returnQuestion;
    backToQuestion.textContent = '回到第 '+returnQuestion+' 題';
    backToQuestion.hidden = false;
  } else if (location.hash===hash) {
    jumpToSource(hash);
  }
});
window.addEventListener('hashchange', () => {
  if (location.hash==='#reading' && graded) showRecap();
  else jumpToSource(location.hash);
});
result.addEventListener('click',event => {
  const button = event.target.closest('[data-station-link]');
  if (button) showStation(Number(button.dataset.stationLink));
});
byId('show-recap').addEventListener('click',showRecap);

form.addEventListener('change', updateProgress);
form.addEventListener('submit', event => {
  event.preventDefault();
  if (graded) return;
  if (stations.some((station,index) => missingAnswers(index).length)) {
    unansweredScope = 'all';
    updateUnanswered();
    return;
  }
  graded = true;
  const wrong = [];
  let score = 0;
  fields.forEach((field,index) => {
    const [,options,correct,paragraphs,why] = questions[Number(field.dataset.question)];
    const inputs = [...field.querySelectorAll('input')];
    const selected = inputs.findIndex(input => input.checked);
    if(selected===correct) score++;
    else wrong.push(index+1);
    inputs.forEach(input => input.disabled = true);
    inputs[correct].closest('label').classList.add('correct');
    if(selected!==correct) inputs[selected].closest('label').classList.add('incorrect');
    const links = paragraphs.map(paragraphLink).join('、');
    const feedback = field.querySelector('.feedback');
    feedback.innerHTML = '<p class="key">'+(selected===correct?'答對了。':'你選了 '+alphabet[selected]+'。')+'正解 '+alphabet[correct]+'．'+esc(options[correct])+'</p><p>'+esc(why)+'</p><p>回看原文 '+links+'</p>';
    feedback.hidden = false;
  });
  form.querySelectorAll('.metaphor-description').forEach(node => { node.hidden = false; });
  const review = wrong.length
    ? '<div class="station-wrong"><p>點選題號回看錯題解析</p>'+wrong.map(n=>'<a href="#question-'+n+'">第 '+n+' 題</a>').join('')+'</div>'
    : '<p>全數答對。</p>';
  result.innerHTML = '<h3>八站完成｜答對 '+score+' / '+questions.length+' 題</h3>'+review+renderRecap();
  restart.hidden = false;
  byId('show-recap').hidden = false;
  updateProgress();
  showRecap();
});
restart.addEventListener('click', () => {
  if (entrancesPlaying) stopEntrance();
  form.reset();
  for (const field of fields) {
    field.querySelectorAll('input').forEach(input => input.disabled = false);
    field.querySelectorAll('.choice').forEach(choice => choice.classList.remove('correct','incorrect'));
    const feedback = field.querySelector('.feedback');
    feedback.hidden = true;
    feedback.replaceChildren();
  }
  form.querySelectorAll('.metaphor-description').forEach(node => { node.hidden = true; });
  graded = false;
  unansweredScope = undefined;
  restart.hidden = true;
  byId('show-recap').hidden = true;
  result.hidden = true;
  result.replaceChildren();
  if (location.hash!=='#reading') history.replaceState(null,'','#reading');
  showStation(0);
});
showStation(0,{focus:false,scroll:false});
if (location.hash) jumpToSource(location.hash);

</script>
